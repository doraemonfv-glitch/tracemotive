[build-system]
requires = ["setuptools>=77,<84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemotive"
version = "0.4.1"
description = "Local-first tracing and debugging for AI agent execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110,<1",
]

[project.urls]
Repository = "https://github.com/doraemonfv-glitch/tracemotive"
Issues = "https://github.com/doraemonfv-glitch/tracemotive/issues"
Security = "https://github.com/doraemonfv-glitch/tracemotive/security"

[project.scripts]
tracemotive = "tracemotive.cli:main"

[project.optional-dependencies]
server = [
    "uvicorn>=0.30,<1",
]
openai-agents = [
    "openai-agents>=0.17,<0.18",
]

[tool.setuptools.packages.find]
include = ["tracemotive*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"tracemotive.ui" = ["index.html", "assets/*"]

[tool.ruff]
target-version = "py310"
src = ["tracemotive", "tests", "scripts"]
extend-exclude = ["frontend", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tracemotive/findings.py" = ["F841"]
"tracemotive/_evaluation/divergence.py" = ["F401"]
